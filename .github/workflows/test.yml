name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: 检查脚本双形态副本完全一致
        run: |
          diff vision.js vision/scripts/vision.js
          diff .env.example vision/.env.example
      - name: 检查规则正文（AGENTS.md 识图段与 SKILL.md 除 frontmatter 外一致）
        run: |
          diff <(sed -n '/^# 识图能力/,$p' vision/SKILL.md | sed 's#node "scripts/vision.js"#node vision.js#g') <(sed -n '/^# 识图能力/,$p' AGENTS.md)
