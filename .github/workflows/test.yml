name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: 检查 skill/ 副本与根目录同步
        run: |
          diff <(grep -v '注意: 本文件与' vision.js) <(grep -v '注意: 本文件与' skill/vision.js)
          diff .env.example skill/.env.example
